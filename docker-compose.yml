services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portfolio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        DOCKER_BUILD: "true"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      # Par défaut la base auto-hébergée ci-dessus ; surchargez DATABASE_URI
      # pour pointer vers Supabase ou toute autre instance PostgreSQL.
      DATABASE_URI: ${DATABASE_URI:-postgresql://portfolio:${POSTGRES_PASSWORD}@postgres:5432/portfolio}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    # Les fichiers téléversés depuis /admin sont des données, pas une partie de
    # l'image : sans ce volume ils disparaîtraient à chaque redéploiement.
    volumes:
      - media-data:/app/apps/frontend/media
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
